name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m compileall -q src scripts
      - name: Validate YAML configuration
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path('.').rglob('*.yaml'):
              if '.git' not in path.parts:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
                  print(path)
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: democlient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: democlient/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build:vite
